spring.application.name=food-delivery-system
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_system
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=FoodDeliverySystemSecretKey2024FoodDeliverySystemSecretKey2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=balu.gounipuram@gmail.com
spring.mail.password=ztbo ggix juyv uftk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.balu=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/food-delivery.log

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads/restaurants

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
# 600000ms = 10 minutes cache expiry

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# FDS Queue names
fds.rabbitmq.exchange=fds.exchange
fds.rabbitmq.queue.order=fds.order.queue
fds.rabbitmq.routing.key.order=fds.order.routing.key

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=fds-group
spring.kafka.consumer.auto-offset-reset=earliest

# FDS Kafka topic
fds.kafka.topic.order-status=fds.order.status.topic

# Scheduler
spring.task.scheduling.pool.size=5

aws.s3.bucket-name=fds-aravindh-restaurant-images
aws.s3.region=ap-south-1
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

